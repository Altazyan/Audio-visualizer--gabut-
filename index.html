<!doctype html>
<html>
  <head>
    <script type="text/javascript" src="./script.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="controls">
      <button id="start-btn">Tes Input V3.2</button>
      <input type="color" id="bar-color" value="#ffffff" />
    </div>

    <svg preserveAspectRatio="none" version="1.1" viewBox="0 0 255 255">
      <defs>
        <mask id="mask" />
        <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="gradient-stop" offset="0%" stop-color="#ffffff" stop-opacity="1" />
        </linearGradient>
      </defs>
      <rect
        x="0"
        y="0"
        width="100%"
        height="100%"
        fill="url(#gradient)"
        mask="url(#mask)"
      ></rect>
    </svg>
  </body>
</html>
